<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>שיחה ראשונה – קולות (סבב 1)</title>
<style>
  :root { --ink:#111; --muted:#8A8A8A; --line:#EAEAEA; --bg:#fff; --ok:#1F8A4C; --no:#C8372D; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, "SF Pro Text", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  main { max-width:600px; margin:0 auto; padding:48px 20px 130px; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 36px; font-size:15px; line-height:1.5; }
  .all { display:flex; align-items:center; gap:14px; width:100%; border:1px solid var(--ink); border-radius:12px; padding:14px 16px; margin-bottom:28px;
         background:var(--ink); color:#fff; font-size:17px; font-weight:600; cursor:pointer; font-family:inherit; }
  .card { display:flex; align-items:flex-start; gap:16px; padding:22px 0; border-top:1px solid var(--line); }
  .card:last-child { border-bottom:1px solid var(--line); }
  .play { flex:none; width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer;
          display:grid; place-items:center; transition:background .15s, color .15s; }
  .card.playing .play { background:var(--ink); color:#fff; }
  .play svg { width:16px; height:16px; }
  .all .play { width:34px; height:34px; border-color:#fff; background:transparent; color:#fff; }
  .body { flex:1; min-width:0; }
  .who { font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
  .num { margin-inline-end:8px; font-variant-numeric:tabular-nums; }
  .line { font-size:24px; line-height:1.5; font-weight:500; }
  .vote { display:flex; gap:8px; margin-top:14px; }
  .vote button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:7px 14px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
  .vote button.on.ok { background:var(--ok); border-color:var(--ok); color:#fff; }
  .vote button.on.no { background:var(--no); border-color:var(--no); color:#fff; }
  .note { display:none; width:100%; margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:16px; font-family:inherit; }
  .note:focus, .general:focus { outline:none; border-color:var(--ink); }
  .card.no .note { display:block; }
  .send { position:fixed; inset-inline:0; bottom:0; padding:14px 20px calc(14px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); }
  .send button { display:block; width:100%; max-width:560px; margin:0 auto; border:0; border-radius:12px; padding:15px; font-size:16px; font-weight:600;
                 background:var(--ink); color:#fff; cursor:pointer; font-family:inherit; }
  .general { width:100%; min-height:80px; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:16px; font-family:inherit; margin-top:10px; }
  label { font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--muted); display:block; margin-top:36px; }
</style>
</head>
<body>
<main>
  <h1>שיחה ראשונה – קולות</h1>
  <p class="sub">סבב 1 · מקשיבים לכל משפט ומסמנים "טוב" או "לתקן".</p>

  <button class="all" id="all"><span class="play"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4v16l13-8z"/></svg></span>כל השיחה ברצף</button>

  <div id="list"></div>

  <label for="general">הערות כלליות</label>
  <textarea class="general" id="general"></textarea>
</main>
<div class="send"><button id="send">שליחה בוואטסאפ</button></div>

<script>
const ROUND = "talk-01 v1";
const LINES = [
  ["itai","הַי, מָה קוֹרֶה?"],
  ["noa","סַבָּבָה, מָה נִשְׁמָע? אֵיךְ קוֹרְאִים לְךָ?"],
  ["itai","קוֹרְאִים לִי אִיתַי. אֵיךְ קוֹרְאִים לָךְ?"],
  ["noa","אֲנִי נוֹעָה. מֵאֵיפֹה אַתָּה? אֵיפֹה אַתָּה גָּר?"],
  ["itai","אֲנִי מִיְּרוּשָׁלַיִם. מֵאֵיפֹה אַתְּ?"],
  ["noa","אֲנִי מִתֵּל אָבִיב. בֶּן כַּמָּה אַתָּה?"],
  ["itai","אֲנִי בֶּן 15. בַּת כַּמָּה אַתְּ?"],
  ["noa","אֲנִי בַּת 14."],
];
const NAME = { noa:"נועה", itai:"איתי" };
const PLAY = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 4v16l13-8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const KEY = "yalla-voices:" + ROUND;
const state = JSON.parse(localStorage.getItem(KEY) || "{}");
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

const audio = new Audio();
let current = null;
function stop() {
  audio.pause();
  if (current) { current.btn.innerHTML = PLAY; current.card && current.card.classList.remove("playing"); }
  current = null;
}
function play(src, btn, card) {
  const same = current && current.btn === btn;
  stop();
  if (same) return;
  audio.src = src; audio.play();
  btn.innerHTML = PAUSE; card && card.classList.add("playing");
  current = { btn, card };
}
audio.onended = stop;

const list = document.getElementById("list");
LINES.forEach(([who, text], i) => {
  const n = i + 1, id = String(n).padStart(2, "0");
  const s = state[n] || (state[n] = {});
  const card = document.createElement("div");
  card.className = "card" + (s.v === "no" ? " no" : "");
  card.style.setProperty("--c", `var(--${who})`);
  card.innerHTML = `
    <button class="play" aria-label="play">${PLAY}</button>
    <div class="body">
      <div class="who"><span class="num">${n}</span>${NAME[who]}</div>
      <div class="line">${text}</div>
      <div class="vote">
        <button class="ok ${s.v === "ok" ? "on" : ""}">טוב</button>
        <button class="no ${s.v === "no" ? "on" : ""}">לתקן</button>
      </div>
      <input class="note" placeholder="מה לתקן? (מילה, הטעמה, טון)" value="${(s.note || "").replace(/"/g, "&quot;")}">
    </div>`;
  const [pb, ok, no, note] = ["button.play", "button.ok", "button.no", ".note"].map(q => card.querySelector(q));
  pb.onclick = () => play(`audio/${id}_${who}.mp3`, pb, card);
  const vote = v => {
    s.v = s.v === v ? undefined : v;
    ok.classList.toggle("on", s.v === "ok"); no.classList.toggle("on", s.v === "no");
    card.classList.toggle("no", s.v === "no"); if (s.v === "no") note.focus();
    save();
  };
  ok.onclick = () => vote("ok"); no.onclick = () => vote("no");
  note.oninput = () => { s.note = note.value; save(); };
  list.appendChild(card);
});

const allBtn = document.getElementById("all"), allIcon = allBtn.querySelector(".play");
allBtn.onclick = () => play("audio/00_all.mp3", allIcon, null);

const general = document.getElementById("general");
general.value = state.general || "";
general.oninput = () => { state.general = general.value; save(); };

document.getElementById("send").onclick = () => {
  const rows = LINES.map(([who, text], i) => {
    const s = state[i + 1] || {};
    const mark = s.v === "ok" ? "✅" : s.v === "no" ? "❌" : "—";
    return `${i + 1}. ${mark} ${NAME[who]}${s.v === "no" && s.note ? ": " + s.note : ""}`;
  });
  let msg = `קולות ${ROUND}\n` + rows.join("\n");
  if (state.general) msg += `\n\nכללי: ${state.general}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
};
</script>
</body>
</html>
